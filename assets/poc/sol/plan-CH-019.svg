<rect x="4" y="288" width="12" height="12" fill="#a89ec4"/>
<text x="20" y="298" font-size="11" fill="#1d1a24">CH-019</text>
<text x="4" y="314" font-size="11" fill="#5c5468">Chemin de terre battue CH-019 seul, sur fond transparent : un exemple d'usage montre le sujet et rien d'autre. Le chemin</text>
<text x="4" y="328" font-size="11" fill="#5c5468">se pose ensuite sur n'importe quel sol, qui n'a pas à être dans son image.</text>
<text x="4" y="342" font-size="11" fill="#5c5468">Un chemin est plat : le moteur peut pivoter ses formes, donc cinq dessins suffisent — extrémité, ligne, angle, trois</text>
<text x="4" y="356" font-size="11" fill="#5c5468">branches, croisement. Cette composition les exerce tous les cinq.</text>
<text x="4" y="370" font-size="11" fill="#5c5468">Pièces distinctes — deux cases portant la même lettre sont la même sprite :</text>
<text x="4" y="384" font-size="11" fill="#5c5468">   A CH-019 shape-s · B CH-019 shape-es · C CH-019 shape-ew · D CH-019 shape-esw · E CH-019 shape-new</text>
<text x="4" y="398" font-size="11" fill="#5c5468">   F CH-019 shape-sw · G CH-019 shape-e · H CH-019 shape-nsw · I CH-019 shape-ns · J CH-019 shape-nes</text>
<text x="4" y="412" font-size="11" fill="#5c5468">   K CH-019 shape-nesw · L CH-019 shape-w · M CH-019 shape-ne · N CH-019 shape-nw · O CH-019 shape-n</text>
<text x="4" y="426" font-size="11" fill="#5c5468">Cellule par défaut : transparent.</text>
