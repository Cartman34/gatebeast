<rect x="4" y="288" width="12" height="12" fill="#a89ec4"/>
<text x="20" y="298" font-size="11" fill="#1d1a24">OB-010</text>
<text x="4" y="314" font-size="11" fill="#5c5468">Clôture OB-010. Carré fermé, une case entre chaque angle et chaque intersection ; croix centrale ; quatre antennes d'une</text>
<text x="4" y="328" font-size="11" fill="#5c5468">case vers l'extérieur, une par côté, partant d'une case entre un angle et une intersection.</text>
<text x="4" y="342" font-size="11" fill="#5c5468">Un point : cette case porte un sujet. Une branche : elle rejoint la case de ce côté-là. Deux cases voisines sans branche</text>
<text x="4" y="356" font-size="11" fill="#5c5468">entre elles ne se rejoignent pas.</text>
<text x="4" y="370" font-size="11" fill="#5c5468">Pièces distinctes — deux cases portant la même lettre sont la même sprite :</text>
<text x="4" y="384" font-size="11" fill="#5c5468">   A OB-010 shape-s · B OB-010 shape-es · C OB-010 shape-ew · D OB-010 shape-esw · E OB-010 shape-new</text>
<text x="4" y="398" font-size="11" fill="#5c5468">   F OB-010 shape-sw · G OB-010 shape-e · H OB-010 shape-nsw · I OB-010 shape-ns · J OB-010 shape-nes</text>
