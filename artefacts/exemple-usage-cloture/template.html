<title>GateBeast — clôture, exemple d'usage</title>
<style>
  :root{
    --ground:#f4f2ec; --card:#fdfcf9; --ink:#1a1c18; --soft:#5f645a; --faint:#8f958a;
    --line:#dedad0; --accent:#7a5d34; --accent-ink:#fdfcf9;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--ground:#161814; --card:#1f221d; --ink:#eff1ea; --soft:#a8aea2; --faint:#7d8378;
      --line:#2f332b; --accent:#c9a76c; --accent-ink:#161814;}
  }
  :root[data-theme="light"]{--ground:#f4f2ec; --card:#fdfcf9; --ink:#1a1c18; --soft:#5f645a;
    --faint:#8f958a; --line:#dedad0; --accent:#7a5d34; --accent-ink:#fdfcf9;}
  :root[data-theme="dark"]{--ground:#161814; --card:#1f221d; --ink:#eff1ea; --soft:#a8aea2;
    --faint:#7d8378; --line:#2f332b; --accent:#c9a76c; --accent-ink:#161814;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 var(--sans);
    padding:2.25rem 1.25rem 4rem;}
  .sheet{max-width:1200px;margin:0 auto;}
  h1{font:600 2rem/1.15 var(--serif);margin:0 0 .5rem;text-wrap:balance;}
  .lede{color:var(--soft);max-width:66ch;margin:0 0 1rem;}
  ul.facts{list-style:none;padding:0;margin:0 0 1.75rem;display:flex;flex-wrap:wrap;gap:.4rem .5rem;}
  ul.facts li{font:.78rem/1 var(--mono);color:var(--faint);border:1px solid var(--line);
    border-radius:2rem;padding:.4rem .7rem;background:var(--card);}
  /* One below the other, never side by side: two columns halve each one and the plan becomes
     unreadable. The page scrolls, the eye does not have to arbitrate. */
  .pair{display:flex;flex-direction:column;gap:1.25rem;}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:.5rem;
    padding:.9rem;}
  figcaption{font:650 1rem/1.3 var(--serif);margin-bottom:.6rem;}
  figcaption span{display:block;font:.78rem/1.5 var(--sans);font-weight:400;color:var(--faint);}
  /* Anything shown can be enlarged by clicking it: on a review page, a detail that cannot be
     brought closer cannot be judged. */
  .frame{border-radius:.35rem;overflow:hidden;cursor:zoom-in;
    background:repeating-conic-gradient(#0000 0 25%, #00000014 0 50%) 0 0/18px 18px;}
  .frame img, .frame svg{display:block;width:100%;height:auto;}
  #loupe{position:fixed;inset:0;z-index:60;display:none;padding:1.5rem;cursor:zoom-out;
    background:rgba(12,14,10,.94);overflow:auto;}
  #loupe.open{display:block;}
  #loupe > *{max-width:none;width:auto;margin:0 auto;
    background:repeating-conic-gradient(#0000 0 25%, #ffffff1a 0 50%) 0 0/18px 18px;}
  details{margin-top:1.75rem;background:var(--card);border:1px solid var(--line);
    border-radius:.5rem;padding:.8rem 1rem;}
  summary{cursor:pointer;font-weight:600;}
  summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  pre{white-space:pre-wrap;font:.78rem/1.6 var(--mono);color:var(--soft);margin:.8rem 0 0;}
</style>

<div class="sheet">
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <ul class="facts" id="facts"></ul>
  <div class="pair">
    <figure>
      <figcaption>Le plan demandé<span>ce qui a été spécifié, case par case</span></figcaption>
      <div class="frame" id="plan"></div>
    </figure>
    <figure id="study-figure" hidden>
      <figcaption>Une seule jointure, en grand<span>c'est ici qu'on juge : sur l'ensemble, un défaut de deux unités est invisible</span></figcaption>
      <div class="frame" id="study"></div>
    </figure>
    <figure id="geometry-figure" hidden>
      <figcaption>La géométrie attendue<span>volumes mesurés sur l'image produite, sans texture ni couleur</span></figcaption>
      <div class="frame" id="geometry"></div>
    </figure>
    <div id="samples"></div>
  </div>
</div>
<div id="loupe" role="dialog" aria-label="Vue agrandie"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  document.getElementById('title').textContent = D.title;
  document.getElementById('lede').textContent = D.lede;
  var facts = document.getElementById('facts');
  D.facts.forEach(function(f){
    var li = document.createElement('li');
    li.textContent = f;
    facts.appendChild(li);
  });
  // The plan is SVG markup produced by our own tool, not user input; it is inserted as markup on
  // purpose, so it scales with the column instead of being pinned to a pixel size.
  document.getElementById('plan').innerHTML = D.plan;
  if(D.study){
    document.getElementById('study').innerHTML = D.study;
    document.getElementById('study-figure').hidden = false;
  }
  if(D.geometry){
    document.getElementById('geometry').innerHTML = D.geometry;
    document.getElementById('geometry-figure').hidden = false;
  }
  // Every version, oldest first: a version is judged against the one before it, so they stack in
  // the order they were produced and none is hidden.
  var host = document.getElementById('samples');
  D.samples.forEach(function(sample, index){
    var fig = document.createElement('figure');
    var cap = document.createElement('figcaption');
    cap.textContent = 'Version ' + (index + 1) + ' — ' + sample.name;
    var sub = document.createElement('span');
    sub.textContent = 'sur damier, pour juger la transparence · clic pour agrandir';
    cap.appendChild(sub);
    fig.appendChild(cap);
    var frame = document.createElement('div');
    frame.className = 'frame';
    var img = document.createElement('img');
    img.src = sample.image;
    img.alt = 'Exemple d’usage de la clôture OB-010, version ' + (index + 1);
    frame.appendChild(img);
    fig.appendChild(frame);
    var box = document.createElement('details');
    var head = document.createElement('summary');
    head.textContent = 'La consigne qui a produit cette version, telle quelle';
    var text = document.createElement('pre');
    text.textContent = sample.prompt;
    box.appendChild(head);
    box.appendChild(text);
    fig.appendChild(box);
    host.appendChild(fig);
  });

  // Click to enlarge, click again to close. The enlarged copy is the same node cloned, so an SVG
  // stays vector — it gains real detail instead of being blown up as pixels.
  var loupe = document.getElementById('loupe');
  document.querySelectorAll('.frame').forEach(function(frame){
    frame.addEventListener('click', function(){
      var copy = frame.firstElementChild.cloneNode(true);
      copy.removeAttribute('width');
      copy.removeAttribute('height');
      copy.style.width = 'min(96vw, 2400px)';
      copy.style.height = 'auto';
      loupe.replaceChildren(copy);
      loupe.classList.add('open');
    });
  });
  loupe.addEventListener('click', function(){ loupe.classList.remove('open'); });
  document.addEventListener('keydown', function(event){
    if(event.key === 'Escape'){ loupe.classList.remove('open'); }
  });
})();
</script>
